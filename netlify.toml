# KIDFLOW · configuración de despliegue en Netlify
[build]
  publish = "."

# Cabeceras generales de seguridad
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Servir la APK con el MIME de paquete Android, para que el móvil
# ofrezca "instalar" en lugar de intentar abrirlo como texto.
[[headers]]
  for = "/KIDFLOW.apk"
  [headers.values]
    Content-Type = "application/vnd.android.package-archive"

# Mismo MIME en el enlace de descarga por si se pide por otra ruta
[[headers]]
  for = "*.apk"
  [headers.values]
    Content-Type = "application/vnd.android.package-archive"
